name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - name: Spec Kit CLI (pinned) for extension install tests
        run: pip install uv && uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@v1.2.3 && echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Record touch (a src/ change appends a record or says why not)
        if: github.event_name == 'pull_request'
        run: python3 tools/record_touch.py --base origin/${{ github.base_ref }}
      - name: Edge snapshot of this repo (bedrock)
        run: PYTHONPATH=src python3 -m aec edges . -o .aec/edges.jsonl
      - name: Records check against the snapshot (fails on dangling code references)
        run: PYTHONPATH=src python3 -m aec check .aec/records.jsonl --edges .aec/edges.jsonl
      - name: Code impact against the PR base (report-only; see the job summary)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
          AEC_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base "$AEC_BASE" HEAD 2>/dev/null) || base=""
          if [ -z "$base" ]; then
            echo "code-impact skipped: no base revision for this event" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          python3 -m aec snapshot . --rev "$base" -o .aec/before.jsonl || {
            echo "code-impact skipped: could not snapshot $base" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          report=$(python3 -m aec code-impact .aec/records.jsonl .aec/before.jsonl .aec/edges.jsonl 2>&1) || true
          printf '%s\n' "$report"
          { echo "## Telosmith code-impact (structural, report-only) vs $base"; echo '```'
            printf '%s\n' "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: WP1A structural diff (artifact, no comments)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        env:
          AEC_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: PYTHONPATH=src python3 -m aec diff --base origin/main --head "$AEC_PR_HEAD" --json > "$RUNNER_TEMP/aec-diff.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        with:
          name: aec-structural-diff
          path: ${{ runner.temp }}/aec-diff.json
      - run: PYTHONPATH=src python3 -m aec check examples/mtg-pilot/records.jsonl
      - name: Adoption path on the fixture repo (init + import-purpose + check)
        run: |
          cp -r tests/fixtures/purpose_repo "$RUNNER_TEMP/repo"
          PYTHONPATH=src python3 -m aec init "$RUNNER_TEMP/repo" --owner ci
          PYTHONPATH=src python3 -m aec import-purpose "$RUNNER_TEMP/repo"
          PYTHONPATH=src python3 -m aec check "$RUNNER_TEMP/repo/.aec/records.jsonl" --edges "$RUNNER_TEMP/repo/.aec/edges.jsonl"

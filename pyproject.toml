[tool.poetry]
name = "codex-plus-plus"
version = "0.1.0"
description = "Codex++: AI-native scaffolding for collaborative coding"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.12.3"
rich = "^13.6.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
scipy = "^1.11.0"
plotly = "^5.18.0"
scikit-learn = "^1.4.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
black = "^24.0"
ruff = "^0.5.0"
isort = "^5.13.0"
pre-commit = "^3.5.0"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

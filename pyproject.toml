[project]
name = "case_study_EDA"
version = "0.1.0"
description = "Additional EDA for interview case study"
authors = [{ name = "ZDR" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "typer>=0.12.3",
    "rich>=13.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scipy>=1.11.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.4.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0",
    "ruff>=0.5.0",
    "isort>=5.13.0",
    "pre-commit>=3.5.0",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88

[tool.uv]
# include your src layout
package = true

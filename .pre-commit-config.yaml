# One tool for linting, import order and formatting (replaces black + isort + ruff v0.5).
# Settings live in pyproject.toml under [tool.ruff].
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
